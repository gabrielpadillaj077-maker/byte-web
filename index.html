<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte - Tu Robot Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #667eea;
        }
        #chat {
            height: 400px;
            overflow-y: auto;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            background: #f5f5f5;
        }
        .msg-user {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 15px;
            margin: 5px 0;
            text-align: right;
        }
        .msg-byte {
            background: #764ba2;
            color: white;
            padding: 8px 12px;
            border-radius: 15px;
            margin: 5px 0;
            text-align: left;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        #userInput {
            flex: 1;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Byte ^w^</h1>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escríbeme algo..." onkeypress="if(event.key==='Enter') enviar()">
            <button onclick="enviar()">Enviar</button>
        </div>
    </div>

    <script>
        async function enviar() {
            let input = document.getElementById("userInput");
            let chat = document.getElementById("chat");
            let texto = input.value;
            if(texto.trim() === "") return;
            
            chat.innerHTML += `<div class="msg-user">Tú: ${texto}</div>`;
            input.value = "";

            // AQUÍ ESTÁ CONECTADO CON TU CEREBRO EN VERCEL
            const res = await fetch("https://byte-web-kappa.vercel.app/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: texto})
            });
            
            const data = await res.json();
            chat.innerHTML += `<div class="msg-byte">Byte: ${data.reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
